<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNLV animation club</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="menu.css">

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
</head>

<body>
    <main>
        <div class="flex-container">
            <div class="column left">
                <a href="/about" class="panel panel-about">
                    <img class="panel-bg" src="images/info panel.webp" alt="what is the club, links and how to join">
                    <img class="panel-fg float" src="images/info mascot.webp" style="width: 42%; bottom: 25%;">
                </a>
                <a href="/portfolio" class="panel panel-portfolio">
                    <img class="panel-bg" src="images/portfolio panel.webp" alt="portfolio">
                    <img class="panel-fg" src="images/portfolio video.webp" style="width: 36%; top: 18%; right: 22.8%">
                </a>
            </div>
            <div class="column right">
                <a href="/events" class="panel panel-events">
                    <img class=" panel-bg" src="images/events panel.webp" alt="past events">
                    <img class="panel-fg breathe" src="images/events jo.webp"
                        style="width: 42%; bottom: 3.5%; left: 2%">
                </a>
                <a href="/commissions" class="panel panel-commissions">
                    <img class="panel-bg" src="images/commissions panel.webp" alt="commissions">
                    <img class="panel-fg" src="images/commissions bubbles.webp"
                        style="width: 82%; bottom: 20%; right: 25%">
                    <img class="panel-fg talking" src="images/commissions ppl.webp"
                        style="width: 65%; bottom: -4.5%; right: -2%">
                </a>
            </div>
        </div>
    </main>
</body>

</html>
