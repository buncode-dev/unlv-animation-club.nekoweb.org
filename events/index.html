<!DOCTYPE html>
<html lang="en" style="background: url('paper.webp') repeat; background-size: fit;">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNLV animation club</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="events.css">

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <img src="events banner.webp" alt="events page">
    </header>
    <main>
        <div class="flex-container">
            <div class="column">
                <section>
                    <div class="title">
                        <h1>upcoming</h1>
                    </div>
                    <iframe class="calendar"
                        src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=America%2FLos_Angeles&showPrint=0&showCalendars=0&showTz=0&showTitle=0&src=NTg5ZTljZTZiM2RjMDE0ZDMwZDU0NTEyMzFkZDUyYzk2OWJlNTcxMWY3YTRlZjdmZGQzODE3MWU5MTkwZTU5NUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&color=%23616161&mode=AGENDA"
                        style="width: 100%; height: 600px; border: none;">
                    </iframe>
                </section>
            </div>

            <div class="column offset-col">
                <section class="diary">
                    <div class="title">
                        <h1>club diary</h1>
                    </div>
                    <div class="entry tape-border">
                        <img class="charm left" src="charm star.webp">
                        <figure>
                            <img src="photos/5-1-26.webp" alt="kareoke potluck night">
                            <figcaption>we held a kareoke potluck night!!! people brought cupcakes, cookies, chips,
                                pizza, and other unhealthy snacks. we partied hard. maybe a little too hard.
                            </figcaption>
                            <date>May 5, 2026</date>
                        </figure>
                    </div>
                    <div class="entry tape-border">
                        <img class="charm right" src="charm pencil.webp">
                        <figure>
                            <img src="photos/4-3-26.webp" alt="drawing challenge">
                            <figcaption>club members got on at 4pm on Magma and were given a mysterious challenge...draw
                                something with a limited color palette!</figcaption>
                            <date>April 3, 2026</date>
                        </figure>
                    </div>
                    <div class="entry tape-border">
                        <img class="charm left" src="charm film.webp">
                        <figure>
                            <img src="photos/3-25-26.webp" alt="portfolio review">
                            <figcaption>we showed off our portfolios to each other and gave feedback!! we all squeezed
                                into an elevator and took a group selfie! we don't really know why we did it.
                            </figcaption>
                            <date>March 25, 2026</date>
                        </figure>
                    </div>
                    <div class="entry tape-border">
                        <img class="charm right" src="charm tablet.webp">
                        <figure>
                            <img src="photos/1-28-26.webp" alt="involvement fair">
                            <figcaption>our brave club officers set up booth at the involvement fair to promote our
                                club!!! it was really hot outside and jo had an absurd number of cookies to hand out.
                            </figcaption>
                            <date>January 28, 2026</date>
                        </figure>
                    </div>
                </section>
            </div>
        </div>
        <footer>
            <p>website + art by <a href="https://www.instagram.com/birbnaise" target="_blank"
                    rel="noopener noreferrer">april</a>! <3</p>
        </footer>
    </main>
    <a class="link-btn back-button" href="../index.html">&lt; home</a>


    <script>
        // tilt all entries by a random amount between -5 and 5 degrees
        const entries = document.querySelectorAll('.entry');
        entries.forEach(entry => {
            const randomAngle = Math.random() * 10 - 5; // random number between -5 and 5
            entry.style.transform = `rotate(${randomAngle}deg)`;
        });
    </script>
</body>

</html>
