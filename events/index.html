<!DOCTYPE html>
<html lang="en" style="background: url('paper.webp') repeat; background-size: fit;">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNLV animation club</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="events.css">

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <img src="events banner.webp" alt="events page">
    </header>
    <main>
        <div class="flex-container">
            <div class="column">
                <section>
                    <div class="title">
                        <h1>upcoming</h1>
                    </div>
                    <iframe class="calendar"
                        src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=America%2FLos_Angeles&showCalendars=0&mode=AGENDA&showPrint=0&showTabs=0&showTz=0&showTitle=0&src=d2FsbGFnM0B1bmx2Lm5ldmFkYS5lZHU&color=%237cb342"
                        style="width: 100%; height: 600px; border: none;">
                    </iframe>
                    <small>events are subject to change. please check our <a
                            href="https://www.instagram.com/unlvanimationclub/" target="_blank"
                            rel="noopener noreferrer">Instagram</a> regularly for updates!</small>
                </section>
            </div>

            <div class="column offset-col">
                <section class="diary">
                    <div class="title">
                        <h1>club diary</h1>
                    </div>
                    <div class="entry tape-border">
                        <img class="charm left" src="charm star.webp">
                        <figure>
                            <img src="photos/10-29-26.webp" alt="halloween jam">
                            <figcaption>we collaborated with LAVA for a halloween jam!! we came in costume, ate food, and
                                sang karaoke!! so many people came and everyone's costumes were amazing :D so fun
                            </figcaption>
                            <date>October 29, 2026</date>
                        </figure>
                    </div>
                    <div class="entry tape-border">
                        <img class="charm right" src="charm pencil.webp">
                        <figure>
                            <img src="photos/10-14-26.webp" alt="figure drawing">
                            <figcaption>we stole some talented people from cosplay club to hold a figure drawing
                                session!!! everyone loved it. we had cosplayers cosplaying characters from Shadow Slave,
                                Deltarune, Limbus Company, JJK, and Obsession. wow...they were so cool...</figcaption>
                            <date>October 14, 2026</date>
                        </figure>
                    </div>
                    <div class="entry tape-border">
                        <img class="charm left" src="charm film.webp">
                        <figure>
                            <img src="photos/10-7-26.webp" alt="RPG party">
                            <figcaption>we held an RPG party challenge, where ppl teamed up to draw OCs to form RPG
                                parties!!! and at the end we presented our parties. we got so many cool characters.
                                like. literal chills running down my spine.
                            </figcaption>
                            <date>October 7, 2026</date>
                        </figure>
                    </div>
                    <div class="entry tape-border">
                        <img class="charm right" src="charm tablet.webp">
                        <figure>
                            <img src="photos/9-24-26.webp" alt="project pitch workshop">
                            <figcaption>for our big semester short film project, we held a project pitch workshop!! we
                                learned what makes a good short film and how to make a solid pitch. shoutouts to
                                Sebastian. omg. such a good teacher.
                            </figcaption>
                            <date>September 24, 2026</date>
                        </figure>
                    </div>
                </section>
            </div>
        </div>
        <footer>
            <p>website by <a href="https://www.instagram.com/birbnaise" target="_blank"
                    rel="noopener noreferrer">april</a> &lt;3 </p>
            <p>menu art by <a href="https://www.instagram.com/hygrocybes" target="_blank"
                    rel="noopener noreferrer">char</a> 🐈‍⬛🐟 </p>
        </footer>
    </main>
    <a class="link-btn back-button" href="../index.html">&lt; home</a>


    <script>
        // tilt all entries by a random amount between -5 and 5 degrees
        const entries = document.querySelectorAll('.entry');
        entries.forEach(entry => {
            const randomAngle = Math.random() * 10 - 5; // random number between -5 and 5
            entry.style.transform = `rotate(${randomAngle}deg)`;
        });
    </script>
</body>

</html>
