<body>
    <header>
        <img src="contact us banner.webp" alt="contact us page">

    <main>
        <div class="flex-container">
            <div class="column">
                <section>
                    <div class="chat-header">

                                <div class="email-content">
                                    unlvanimat<span>ioncl</span>ub@<span>yahoo.com</span>gmail.com

                                    target="_blank" rel="noopener noreferrer">discord</a>!

                            </div>

                        </div>
                    </div>
                </section>
            </div>
        </div>
        <footer>
            <p>website + art by <a href="https://www.instagram.com/birbnaise" target="_blank"
